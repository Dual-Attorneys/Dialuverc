name: "Continuous Integration"

on:
  push:
    branches:
      - "main"
  pull_request:
    types:
      - synchronize
      - opened
  # For testing.
  workflow_dispatch:

jobs:

  build-and-test:
  
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      # This should have been done before pushing.
      - name: Check style
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build

      - name: Run tests
        run: dotnet test --no-build
